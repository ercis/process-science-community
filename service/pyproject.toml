[project]
name = "psc-join-collector"
version = "1.0.0"
description = "Join form collector for the Process Science Community."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
