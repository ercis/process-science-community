# Runs the join collector next to whatever else is on the ERCIS VM.
# The existing Caddy fans a path to it; see README.md.
services:
  join-collector:
    build: .
    restart: unless-stopped
    environment:
      # Origins allowed to POST the form. Add the GitHub Pages origin too while
      # the custom domain is still propagating.
      JOIN_ALLOWED_ORIGINS: "https://process-science.org,https://www.process-science.org"
      # Generate with: openssl rand -hex 32   (keep it out of git, use .env)
      JOIN_EXPORT_TOKEN: "${JOIN_EXPORT_TOKEN:?set JOIN_EXPORT_TOKEN in .env}"
      JOIN_RATE_LIMIT: "20"
      JOIN_TRUST_PROXY: "1"
    volumes:
      - join-data:/data
    # No published port: only the reverse proxy on the same network reaches it.
    expose:
      - "8080"

volumes:
  join-data:
